<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make a Payment</title>
</head>
<body>
<h2>💳 Secure Payment Form</h2>

<!-- Display error message if username is invalid -->
<div th:if="${error}" style="color: red; font-weight: bold;">
  <p th:text="${error}"></p>
</div>

<!-- Show escaped username to demonstrate XSS protection -->
<div th:if="${payment.username}">
  <p><strong>Debug (escaped username):</strong>
    <span th:text="${payment.username}">[escaped username]</span>
  </p>
</div>

<!-- Form bound to Payment object -->
<form action="/payment" method="post" th:object="${payment}">
  <label for="username">Username:</label><br>
  <input type="text" id="username" th:field="*{username}" required><br><br>

  <label for="cardNumber">Card Number:</label><br>
  <input type="text" id="cardNumber" th:field="*{cardNumber}" required><br><br>

  <label for="cvv">CVV:</label><br>
  <input type="password" id="cvv" th:field="*{cvv}" required><br><br>

  <label for="amount">Amount:</label><br>
  <input type="number" step="0.01" id="amount" th:field="*{amount}" required><br><br>

  <button type="submit">Pay Now</button>
</form>
</body>
</html>
